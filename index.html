<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="شروق">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0a10">
<meta name="description" content="عبارات غزل رومانسية لاسم شروق">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<link rel="icon" href="icons/icon-192.svg">

<title>غزل شروق 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5a3;
    --rose: #d4617a;
    --rose-dark: #8b2040;
    --cream: #fdf6ec;
    --dark: #0d0508;
    --mid: #2a0f18;
    --card: #1e0c13;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--dark);
    font-family: 'Amiri', serif;
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
  }

  /* ── Starfield ── */
  #canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Scroll container ── */
  .scroll {
    position: fixed;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    z-index: 2;
    padding-top: calc(var(--safe-top) + 8px);
    padding-bottom: calc(var(--safe-bot) + 24px);
  }

  .app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.2rem 1rem 2rem;
    max-width: 430px;
    margin: 0 auto;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    padding: 0.5rem 0 1.4rem;
    animation: fadeDown 0.9s ease both;
  }
  @keyframes fadeDown {
    from { opacity:0; transform:translateY(-24px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .moon {
    display: inline-block;
    font-size: 2.6rem;
    animation: sway 5s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(201,169,110,0.6));
  }
  @keyframes sway {
    0%,100% { transform:rotate(-10deg) scale(1); }
    50%      { transform:rotate(10deg) scale(1.05); }
  }

  .title {
    font-family: 'Scheherazade New', serif;
    font-size: clamp(2.4rem, 9vw, 3rem);
    background: linear-gradient(145deg, #f0d080, var(--gold), var(--rose), #f0d080);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
    line-height: 1;
    margin-top: 0.1rem;
  }
  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .tagline {
    color: rgba(201,169,110,0.55);
    font-size: 0.88rem;
    margin-top: 0.35rem;
    letter-spacing: 0.06em;
  }

  /* ── Main card ── */
  .card {
    width: 100%;
    background: linear-gradient(160deg, var(--card) 0%, #130710 100%);
    border: 1px solid rgba(201,169,110,0.22);
    border-radius: 28px;
    padding: 1.8rem 1.5rem 1.6rem;
    box-shadow:
      0 0 0 1px rgba(201,169,110,0.05),
      0 8px 40px rgba(0,0,0,0.7),
      0 0 80px rgba(212,97,122,0.08) inset;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.9s 0.2s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(32px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .card::before {
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(201,169,110,0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(212,97,122,0.07) 0%, transparent 55%);
    pointer-events:none;
  }

  /* ── Ornament ── */
  .ornament {
    text-align: center;
    color: var(--gold);
    font-size: 1.1rem;
    letter-spacing: 0.8em;
    opacity: 0.45;
    margin-bottom: 1.1rem;
  }

  /* ── Category pills ── */
  .cats {
    display: flex;
    gap: 0.4rem;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 0.2rem;
    margin-bottom: 1.2rem;
    justify-content: center;
  }
  .cats::-webkit-scrollbar { display:none; }

  .pill {
    flex-shrink: 0;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(.34,1.56,.64,1);
    font-family: 'Amiri', serif;
    border: 1px solid rgba(201,169,110,0.22);
    color: rgba(201,169,110,0.5);
    background: transparent;
    user-select: none;
  }
  .pill.active {
    background: linear-gradient(135deg, rgba(201,169,110,0.18), rgba(212,97,122,0.12));
    border-color: var(--gold);
    color: var(--gold-light);
    transform: scale(1.05);
  }

  /* ── Poem area ── */
  .poem-wrap {
    min-height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0;
    position: relative;
  }

  .placeholder {
    text-align: center;
    color: rgba(201,169,110,0.28);
    font-size: 1rem;
    line-height: 2;
    font-family: 'Scheherazade New', serif;
  }

  .poem {
    font-family: 'Scheherazade New', serif;
    font-size: clamp(1.3rem, 5vw, 1.55rem);
    line-height: 2.1;
    color: var(--cream);
    text-align: center;
    opacity: 0;
    transform: translateY(14px) scale(0.97);
    transition: opacity 0.55s ease, transform 0.55s ease;
  }
  .poem.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .poem em {
    color: var(--gold);
    font-style: normal;
    font-weight: 700;
    text-shadow: 0 0 20px rgba(201,169,110,0.5);
  }

  /* ── Loading ── */
  .loader {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .loader.show { display: flex; }
  .loader-ring {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(201,169,110,0.15);
    border-top-color: var(--gold);
    border-right-color: var(--rose);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loader-text {
    color: rgba(201,169,110,0.6);
    font-size: 0.95rem;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin: 1.2rem 0;
    opacity: 0.2;
  }
  .divider::before, .divider::after {
    content:'';
    flex:1;
    height:1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .divider::after {
    background: linear-gradient(to left, transparent, var(--gold));
  }
  .divider span { color:var(--gold); font-size:0.8rem; }

  /* ── Main button ── */
  .btn-main {
    width: 100%;
    padding: 1.05rem;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--rose-dark), var(--rose) 60%, #e87a92);
    color: white;
    font-family: 'Scheherazade New', serif;
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(212,97,122,0.45), 0 0 0 1px rgba(255,255,255,0.05) inset;
    transition: all 0.22s cubic-bezier(.34,1.56,.64,1);
    user-select: none;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.02em;
  }
  .btn-main::after {
    content:'';
    position:absolute;
    top:0; left:-100%;
    width:60%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left 0.5s ease;
  }
  .btn-main:active { transform:scale(0.96); box-shadow:0 2px 12px rgba(212,97,122,0.3); }
  .btn-main:active::after { left:140%; }

  /* ── Action row ── */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    margin-top: 0.7rem;
  }
  .btn-act {
    padding: 0.65rem 0.5rem;
    border-radius: 14px;
    border: 1px solid rgba(201,169,110,0.22);
    background: rgba(201,169,110,0.05);
    color: var(--gold-light);
    font-family: 'Amiri', serif;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    user-select: none;
  }
  .btn-act:active { background:rgba(201,169,110,0.12); transform:scale(0.97); }

  /* ── Counter ── */
  .counter {
    text-align: center;
    color: rgba(201,169,110,0.3);
    font-size: 0.82rem;
    margin-top: 0.9rem;
  }

  /* ── History section ── */
  .history-wrap {
    width: 100%;
    margin-top: 1.2rem;
    animation: fadeUp 0.9s 0.4s ease both;
  }
  .history-title {
    color: rgba(201,169,110,0.45);
    font-size: 0.88rem;
    text-align: center;
    margin-bottom: 0.7rem;
    letter-spacing: 0.05em;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .history-item {
    background: rgba(201,169,110,0.04);
    border: 1px solid rgba(201,169,110,0.1);
    border-radius: 16px;
    padding: 0.9rem 1.1rem;
    font-family: 'Scheherazade New', serif;
    font-size: 1rem;
    color: rgba(253,246,236,0.7);
    line-height: 1.9;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .history-item:active { background:rgba(201,169,110,0.09); }
  .history-item em { color:var(--gold); font-style:normal; }
  .history-badge {
    position: absolute;
    top: 0.4rem;
    left: 0.6rem;
    font-size: 0.65rem;
    color: rgba(201,169,110,0.35);
  }

  /* ── Install banner ── */
  .install-bar {
    display: none;
    width: 100%;
    background: linear-gradient(135deg, var(--mid), #3a1020);
    border: 1px solid rgba(201,169,110,0.3);
    border-radius: 18px;
    padding: 1rem 1.2rem;
    margin-bottom: 1rem;
    flex-direction: row;
    align-items: center;
    gap: 0.8rem;
    animation: fadeDown 0.5s ease both;
  }
  .install-bar.visible { display: flex; }
  .install-bar-text {
    flex: 1;
    font-size: 0.9rem;
    color: var(--gold-light);
    line-height: 1.5;
  }
  .install-bar-text strong { color: var(--gold); display:block; font-size:1rem; }
  .btn-install {
    flex-shrink: 0;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    background: var(--gold);
    color: var(--dark);
    border: none;
    font-family: 'Amiri', serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-install:active { transform:scale(0.95); }
  .btn-close-install {
    background: none; border: none; color: rgba(201,169,110,0.4);
    font-size: 1.1rem; cursor:pointer; padding:0.2rem;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bot) + 1.5rem);
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--mid);
    border: 1px solid rgba(201,169,110,0.35);
    color: var(--gold-light);
    padding: 0.65rem 1.6rem;
    border-radius: 999px;
    font-family: 'Amiri', serif;
    font-size: 1rem;
    opacity: 0;
    transition: all 0.28s cubic-bezier(.34,1.56,.64,1);
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Floating hearts ── */
  .heart-fx {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    font-size: 1.3rem;
    animation: heartFloat 1.6s ease forwards;
  }
  @keyframes heartFloat {
    0%   { opacity:1; transform:translateY(0) scale(1) rotate(0deg); }
    100% { opacity:0; transform:translateY(-130px) scale(1.4) rotate(20deg); }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="scroll">
<div class="app">

  <!-- Install Banner -->
  <div class="install-bar" id="installBar">
    <div style="font-size:1.8rem">📲</div>
    <div class="install-bar-text">
      <strong>ثبّت التطبيق</strong>
      احفظه على شاشتك الرئيسية
    </div>
    <button class="btn-install" id="installBtn">تثبيت</button>
    <button class="btn-close-install" id="closeInstall">✕</button>
  </div>

  <!-- Header -->
  <div class="header">
    <span class="moon">🌙</span>
    <div class="title">غزل شروق</div>
    <div class="tagline">كلمات من القلب • لأجمل الأسماء</div>
  </div>

  <!-- Main Card -->
  <div class="card">
    <div class="ornament">❧ ✦ ❧</div>

    <div class="cats" id="cats">
      <button class="pill active" data-cat="romantic" onclick="setCat(this)">💕 رومانسي</button>
      <button class="pill" data-cat="poetic" onclick="setCat(this)">📜 شعري</button>
      <button class="pill" data-cat="sweet" onclick="setCat(this)">🍯 حلو</button>
      <button class="pill" data-cat="classic" onclick="setCat(this)">🌹 كلاسيكي</button>
      <button class="pill" data-cat="longing" onclick="setCat(this)">🌊 شوق</button>
    </div>

    <div class="poem-wrap" id="poemWrap">
      <div class="loader" id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">جاري كتابة الغزل…</div>
      </div>
      <div class="poem" id="poem">
        <div class="placeholder">
          ✦<br>اضغط الزر أدناه<br>لتحصل على عبارة غزل<br>خاصة بـ <span style="color:var(--gold)">شروق</span><br>✦
        </div>
      </div>
    </div>

    <div class="divider"><span>✦</span></div>

    <button class="btn-main" id="genBtn" onclick="generate()">
      ✨ اكتب لي غزلاً بـ شروق
    </button>

    <div class="actions">
      <button class="btn-act" onclick="copyPoem()">📋 نسخ</button>
      <button class="btn-act" onclick="sharePoem()">💌 مشاركة</button>
    </div>

    <div class="counter" id="counter"></div>
  </div>

  <!-- History -->
  <div class="history-wrap" id="histWrap" style="display:none">
    <div class="history-title">✦ عبارات سابقة ✦</div>
    <div class="history-list" id="histList"></div>
  </div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Starfield Canvas ──
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let stars = [];

function initCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = Array.from({length:120}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.3,
    a: Math.random(),
    da: (Math.random() * 0.01 + 0.003) * (Math.random() < 0.5 ? 1 : -1)
  }));
}

function drawStars() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s => {
    s.a = Math.max(0.05, Math.min(1, s.a + s.da));
    if (s.a <= 0.05 || s.a >= 1) s.da *= -1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}

initCanvas();
drawStars();
window.addEventListener('resize', initCanvas);

// ── State ──
let cat = 'romantic';
let currentPoem = '';
let count = 0;
let history = JSON.parse(localStorage.getItem('shrouk_history') || '[]');
let isLoading = false;

const catMap = {
  romantic: 'عبارات غزل رومانسية عاطفية مشتعلة بالمشاعر تعبّر عن الحب الصادق والعميق',
  poetic:   'أبيات شعرية موزونة ذات إيقاع جميل تشبه الشعر العربي الكلاسيكي بصور شعرية راقية',
  sweet:    'عبارات حلوة وناعمة وخفيفة على القلب تجعل القارئ يبتسم من الدفء والحنان',
  classic:  'عبارات بأسلوب الشعراء العرب الكلاسيكيين القدامى كالمتنبي وابن الفارض',
  longing:  'عبارات تعبّر عن الشوق والحنين والانتظار وتوق القلب للقاء المحبوبة'
};

function setCat(el) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  cat = el.dataset.cat;
}

// ── Generate ──
async function generate() {
  if (isLoading) return;
  isLoading = true;

  const poemEl  = document.getElementById('poem');
  const loaderEl = document.getElementById('loader');
  const btn = document.getElementById('genBtn');

  poemEl.classList.remove('show');
  await sleep(300);
  poemEl.innerHTML = '';
  loaderEl.classList.add('show');
  btn.disabled = true;
  btn.style.opacity = '0.7';

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: `أنت شاعر عربي رومانسي موهوب. اكتب ${catMap[cat]} تتضمن اسم "شروق" بشكل جميل وطبيعي.

القواعد الصارمة:
- أبرز اسم شروق بعلامة النجمة هكذا **شروق** فقط
- لا تكتب أكثر من 4 أسطر شعرية
- كل سطر لا يتجاوز 8 كلمات
- استخدم صور شعرية من الطبيعة: الفجر، الشمس، الضياء، النور، القمر، الورد، المطر
- لا تكتب أي مقدمة أو تعليق، فقط الأسطر الشعرية مباشرة`
        }]
      })
    });

    const data = await res.json();
    let text = data.content?.map(b => b.text || '').join('') || 'حدث خطأ، حاول مجدداً';

    // Format
    text = text.replace(/\*\*(شروق)\*\*/g, '<em>$1</em>');
    text = text.replace(/(?<!<em>)(شروق)(?!<\/em>)/g, '<em>$1</em>');
    text = text.replace(/\n/g, '<br>');
    text = text.replace(/^\s*[-–]\s*/gm, '');

    loaderEl.classList.remove('show');
    poemEl.innerHTML = text;
    currentPoem = poemEl.innerText || poemEl.textContent;

    requestAnimationFrame(() => requestAnimationFrame(() => poemEl.classList.add('show')));

    count++;
    document.getElementById('counter').textContent = `✦ عدد العبارات: ${count} ✦`;

    // Save history
    const raw = currentPoem.trim();
    if (raw) {
      history.unshift({ text: text, plain: raw, cat });
      if (history.length > 10) history.pop();
      localStorage.setItem('shrouk_history', JSON.stringify(history));
      renderHistory();
    }

    spawnHearts();

  } catch(e) {
    document.getElementById('loader').classList.remove('show');
    poemEl.innerHTML = '<span style="color:var(--rose)">حدث خطأ 💔<br>تحقق من الاتصال وحاول مجدداً</span>';
    poemEl.classList.add('show');
  }

  btn.disabled = false;
  btn.style.opacity = '1';
  isLoading = false;
}

// ── History ──
function renderHistory() {
  const wrap = document.getElementById('histWrap');
  const list = document.getElementById('histList');
  if (!history.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  const catEmoji = {romantic:'💕',poetic:'📜',sweet:'🍯',classic:'🌹',longing:'🌊'};
  list.innerHTML = history.slice(0,5).map((h,i) => `
    <div class="history-item" onclick="reuseHistory(${i})">
      <span class="history-badge">${catEmoji[h.cat]||'✦'}</span>
      ${h.text}
    </div>
  `).join('');
}

function reuseHistory(i) {
  const h = history[i];
  if (!h) return;
  const poemEl = document.getElementById('poem');
  poemEl.classList.remove('show');
  setTimeout(() => {
    poemEl.innerHTML = h.text;
    currentPoem = h.plain;
    requestAnimationFrame(() => requestAnimationFrame(() => poemEl.classList.add('show')));
  }, 250);
  showToast('✦ تم استرجاع العبارة');
}

// ── Copy / Share ──
function copyPoem() {
  if (!currentPoem) { showToast('لا توجد عبارة بعد! 💔'); return; }
  navigator.clipboard.writeText(currentPoem)
    .then(() => showToast('✅ تم النسخ!'))
    .catch(() => {
      // fallback
      const el = document.createElement('textarea');
      el.value = currentPoem;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      el.remove();
      showToast('✅ تم النسخ!');
    });
}

function sharePoem() {
  if (!currentPoem) { showToast('لا توجد عبارة بعد! 💔'); return; }
  const shareText = `🌹 غزل في شروق:\n\n${currentPoem}\n\n— من تطبيق غزل شروق 💖`;
  if (navigator.share) {
    navigator.share({ text: shareText, title: 'غزل لشروق 🌹' });
  } else {
    navigator.clipboard.writeText(shareText)
      .then(() => showToast('💌 تم النسخ للمشاركة!'));
  }
}

// ── Hearts FX ──
function spawnHearts() {
  const emojis = ['💖','💗','💕','💓','✨','🌹','🌸'];
  const rect = document.getElementById('genBtn').getBoundingClientRect();
  for (let i = 0; i < 8; i++) {
    const h = document.createElement('div');
    h.className = 'heart-fx';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.cssText = `
      left:${rect.left + Math.random()*rect.width}px;
      top:${rect.top}px;
      animation-delay:${Math.random()*0.4}s;
      font-size:${1+Math.random()*0.8}rem;
    `;
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 2100);
  }
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── PWA Install ──
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBar').classList.add('visible');
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBar').classList.remove('visible');
  if (outcome === 'accepted') showToast('🎉 تم تثبيت التطبيق!');
});

document.getElementById('closeInstall').addEventListener('click', () => {
  document.getElementById('installBar').classList.remove('visible');
});

window.addEventListener('appinstalled', () => {
  showToast('🎉 تم تثبيت التطبيق بنجاح!');
  document.getElementById('installBar').classList.remove('visible');
});

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ── Init ──
renderHistory();
</script>
